    <!-- Motyw: ustaw klasę .dark PRZED renderem, żeby uniknąć mignięcia (FOUC) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('motoskan-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
